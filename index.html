.hide{display:none!important}.coverbig{height:160px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#e6c9b6,#f5e7d3);margin-bottom:15px}

.chapter-switch button{flex:1;min-height:44px}

.chaptertext .para {
  margin: 0 0 .82em;
  padding: 0;
  display: flow-root;
}
.chaptertext .para-text {
  line-height: 1.85;
}

.chaptertext .bubble-button { display: inline-flex; vertical-align: baseline; align-items: center; gap: 2px; margin-left: .18em; padding: 0 2px; border: 0; background: transparent; color: #77796f; font: inherit; font-size: .76em; line-height: 1; cursor: pointer; white-space: nowrap; }
.chaptertext .bubble-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chaptertext .para-action {
  display: inline;
  margin: 0;
  padding: 0;
}
.chaptertext .add-comment-link {
  display: inline;
  float: none;
  margin: 0 0 0 0.35em;
  border: 0;
  padding: 0 3px;
  color: #99958a;
  background: transparent;
  font: inherit;
  font-size: 0.88em;
  line-height: inherit;
  cursor: pointer;
  opacity: 0.65;
}

.chaptertext .add-comment-link:hover,
.chaptertext .add-comment-link:focus {
  opacity: 1;
  color: #6e7867;
}
.chaptertext .para-comments { margin: .08em 0 .03em; padding: .20em .38em; border-radius: 7px; background: #eee9df; font-size: .88em; }
.chaptertext .para-comments .comment { margin: 0; }
.reader-extra .comment-floor{display:inline;font-size:.72em;line-height:1;color:rgba(70,68,64,.75);opacity:1;margin:0 .45em 0 0}
.reader-extra .comment .comment-floor{display:inline;font-size:.72em;line-height:1;color:rgba(70,68,64,.75);opacity:1;margin:0 .45em 0 0}
.reader-extra .comment-reply-prefix .comment-floor{display:inline;font-size:.72em;line-height:1;color:rgba(70,68,64,.75);opacity:1;margin:0}
.chaptertext .para-comments .secondary { margin-top: .08em; }
.chaptertext .para-comments .comment-reply,.reader-extra .comment-reply{margin-left:.8em;padding-left:0;border-left:0;margin-top:-1px;margin-bottom:-3px}
.comment-actions{display:inline-flex;gap:6px;margin-left:6px}
.comment-actions button{font-size:.9em}
.comment-floor{color:rgba(70,68,64,.75);opacity:1}
.comment-reply-label,.comment-actions button{opacity:.42}
.comment-text{color:#000;opacity:1}
.comment-reply-prefix{color:rgba(70,68,64,.85);opacity:1}
.comment-reply-prefix .comment-floor{display:inline;font-size:.72em;line-height:1;color:rgba(70,68,64,.75);opacity:1;margin:0}
.chaptertext .para-comments .comment-reply,.reader-extra .comment-reply{margin-left:.65em;padding-left:0;border-left:0;margin-top:-3px;margin-bottom:-4px}
.reader-extra .comment-floor,.reader-extra .comment-body,.reader-extra .comment-text,.reader-extra .comment-reply-prefix{display:inline}


body.read-mode .management-control { display: none !important; }

.mode-switch { display:flex; gap:8px; margin:12px 0; }
.mode-switch button { flex:1; }
.mode-switch button.selected { outline:2px solid var(--accent); outline-offset:2px; }



body{--reader-font:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;--reader-size:18px;--reader-line:1.95}
#readerView{background:var(--reader-bg-color,#f7f5f0);background-image:var(--reader-bg-image,none);background-size:cover;background-position:center;background-attachment:fixed}.chaptertext{font-family:var(--reader-font);font-size:var(--reader-size);line-height:var(--reader-line);}
.chaptertext .para-text{line-height:inherit}

#readerView .chapter-end-matter{display:block}

.setting-value{min-width:48px;text-align:right;color:var(--muted);font-size:12px}

#globalThemeCSS{width:100%;min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;white-space:pre;tab-size:2}

#readerView .chaptertext span,
#readerView .chaptertext div {
  font-family: "PingFang SC", "Hiragino Sans GB", sans-serif !important;
  font-weight: 400 !important;

<style id="comment-unified-opacity-fix">
/* 评论楼层与“回复”统一为同一色值与 82% 透明度；正文保持纯黑 */
.comment-floor,
.comment-reply-prefix,
.comment-reply-prefix .comment-floor,
.reader-extra .comment-floor,
.reader-extra .comment-reply-prefix {
  color: rgba(70,68,64,.75) !important;
  opacity: 1 !important;
}
.comment-text,
.comment-body {
  color: #111 !important;
}
</style>
<style id="comment-opacity-final">
/* 评论编号与回复文字再减淡一档：70% */
.comment-floor,
.comment-reply-prefix,
.comment-reply-prefix .comment-floor,
.reader-extra .comment-floor,
.reader-extra .comment-reply-prefix {
  color: rgba(70,68,64,.55) !important;
  opacity: 1 !important;
}
</style>
<style id="ui-fade-final">
/* 阅读模式的段评添加按钮与收起表头后的呼出按钮仅保留功能，视觉上完全隐去 */
body.read-mode .chaptertext .add-comment-link { opacity: 0 !important; }
.header-reveal { opacity: 0 !important; }
</style>
<style id="reader-tint-color-circles">
/* 阅读底图颜色选择器：三个圆本身就是对应底图颜色 */
.reader-tint-option[data-reader-tint="original"]{background:#E6E6DD !important}
.reader-tint-option[data-reader-tint="green"]{background:#CEDABF !important}
.reader-tint-option[data-reader-tint="blue"]{background:#C2D7E6 !important}
.reader-tint-option{appearance:none;-webkit-appearance:none}
</style>

<body>

<script>
const KEY='private_tomato_v1';
let db=loadDB(), filter='all', currentBook=null,currentChapter=null, editorBook=null;
let appMode=localStorage.getItem('private_tomato_mode')||'edit';
let readerPrefs={
  pageMode:'scroll',
  size:Number(localStorage.getItem('private_tomato_font_size')||18),
  line:Number(localStorage.getItem('private_tomato_line_height')||1.95),
  bgColor:localStorage.getItem('private_tomato_reader_bg_color')||'#f7f5f0',
  bgImage:localStorage.getItem('private_tomato_reader_bg_image')||''
};
const READER_BACKDROP_KEY='private_tomato_reader_backdrop_tint';
const READER_BACKDROP_OPTIONS={
  original:{label:'原始',color:'#E6E6DD',blend:'color',opacity:0,filter:'none'},
  green:{label:'绿色',color:'#CEDABF',blend:'color',opacity:1,filter:'brightness(.94)'},
  blue:{label:'蓝色',color:'#C2D7E6',blend:'color',opacity:1,filter:'brightness(.93)'},
  dark:{label:'暗色',color:'#4D4D4D',blend:'normal',opacity:0,filter:'brightness(.34)'}
};
const READER_LIGHT_BACKDROP_KEY='private_tomato_reader_light_backdrop_tint';
let readerBackdropTint=localStorage.getItem(READER_LIGHT_BACKDROP_KEY)||localStorage.getItem(READER_BACKDROP_KEY)||'original';
if(!['original','green','blue'].includes(readerBackdropTint))readerBackdropTint='original';
function applyReaderBackdrop(){
  const root=document.getElementById('readerBackdrop');
  if(!root)return;
  const tint=root.querySelector('.reader-backdrop-tint');
  const image=root.querySelector('img');
  const night=localStorage.getItem(NIGHT_MODE_KEY)==='1';
  const key=night?'dark':readerBackdropTint;
  const opt=READER_BACKDROP_OPTIONS[key]||READER_BACKDROP_OPTIONS.original;
  root.style.setProperty('--reader-tint',opt.color);
  if(image)image.style.filter=opt.filter||'none';
  if(tint){tint.style.background=opt.color;tint.style.mixBlendMode=opt.blend;tint.style.opacity=String(opt.opacity)}
  document.querySelectorAll('[data-reader-tint]').forEach(btn=>btn.classList.toggle('selected',!night && btn.dataset.readerTint===readerBackdropTint));
  const trigger=document.getElementById('readerTintTrigger');
  if(trigger)trigger.style.background=READER_BACKDROP_OPTIONS[readerBackdropTint].color;
}
function setReaderBackdropTint(key){
  if(!['original','green','blue'].includes(key))return;
  readerBackdropTint=key;
  localStorage.setItem(READER_LIGHT_BACKDROP_KEY,key);
  applyReaderBackdrop();
  const menu=document.getElementById('readerTintMenu');
  if(menu)menu.classList.remove('open');
}
function updateReaderTintPickerVisibility(){
  const picker=document.getElementById('readerTintPicker');
  if(picker)picker.classList.toggle('visible',document.body.classList.contains('reading-active') && localStorage.getItem(NIGHT_MODE_KEY)!=='1');
}
let brandPrefs={
  emoji:localStorage.getItem('private_tomato_header_emoji') ?? '📖',
  title:localStorage.getItem('private_tomato_header_title') ?? '自定义标题',
  subtitle:localStorage.getItem('private_tomato_header_subtitle') ?? '自定义文本'
};
function applyBrandPrefs(){
  const emoji=document.getElementById('brandEmoji');
  const title=document.getElementById('brandTitle');
  const subtitle=document.getElementById('brandSubtitle');
  if(emoji)emoji.textContent=brandPrefs.emoji;
  if(title)title.textContent=brandPrefs.title;
  if(subtitle)subtitle.textContent=brandPrefs.subtitle;
  document.title=brandPrefs.title||'自定义标题';
}
function updateBrandPref(key,value){
  if(!Object.prototype.hasOwnProperty.call(brandPrefs,key))return;
  brandPrefs[key]=value;
  const storageKey={emoji:'private_tomato_header_emoji',title:'private_tomato_header_title',subtitle:'private_tomato_header_subtitle'}[key];
  localStorage.setItem(storageKey,value);
  applyBrandPrefs();
}
function hideHeader(){
  document.body.classList.add('header-collapsed');
  document.getElementById('showHeaderBtn').classList.remove('hide');
}
function showHeader(){
  document.body.classList.remove('header-collapsed');
  document.getElementById('showHeaderBtn').classList.add('hide');
}
const NIGHT_MODE_KEY='private_tomato_night_mode';
function applyNightMode(){
  const on=localStorage.getItem(NIGHT_MODE_KEY)==='1';
  document.body.classList.toggle('dark-mode',on);
  const b=document.getElementById('nightModeBtn');
  if(b){
    b.innerHTML=on?'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>':'☾';
    b.setAttribute('aria-label',on?'切换浅色模式':'切换夜间模式');
    b.title=on?'切换浅色模式':'切换夜间模式';
  }
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',on?'#171715':'#f7f5f0');
  applyReaderBackdrop();
  updateReaderTintPickerVisibility();
}
function toggleNightMode(){
  localStorage.setItem(NIGHT_MODE_KEY,localStorage.getItem(NIGHT_MODE_KEY)==='1'?'0':'1');
  applyNightMode();
}
function fontStack(){return '-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif'}
function applyReaderPrefs(){readerPrefs.pageMode='scroll';localStorage.setItem('private_tomato_page_mode','scroll');document.body.classList.remove('cover-reader');document.body.style.setProperty('--reader-font',fontStack());document.body.style.setProperty('--reader-size',readerPrefs.size+'px');document.body.style.setProperty('--reader-line',readerPrefs.line);applyReaderBackdrop()}
function updateReaderPref(key,value){if(key==='size'){readerPrefs.size=Number(value);localStorage.setItem('private_tomato_font_size',String(value))}else if(key==='line'){readerPrefs.line=Number(value);localStorage.setItem('private_tomato_line_height',String(value))}applyReaderPrefs();showSettings();if(currentBook&&currentChapter&&!document.getElementById('readerView').classList.contains('hide'))renderReader()}
function updateChapterSwitchVisibility(){const endMatter=document.querySelector('#readerView .chapter-end-matter');if(endMatter)endMatter.classList.add('on-last-page')}
function bindReaderKeys(){}
function applyMode(){document.body.classList.toggle('read-mode',appMode==='read');document.body.classList.toggle('edit-mode',appMode==='edit')}
function setMode(mode){appMode=mode;localStorage.setItem('private_tomato_mode',mode);applyMode();showSettings();renderHome();if(currentBook&&currentChapter&&!document.getElementById('readerView').classList.contains('hide'))renderReader();if(currentBook&&!document.getElementById('detailView').classList.contains('hide'))openDetail(currentBook)}
function uid(){return Math.random().toString(36).slice(2,10)}
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{books:[]}}catch(e){return {books:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderHome()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function forceSettingsTop(){
  const main=document.querySelector('main');
  if(main)main.scrollTop=0;
}

function sizeMainArea(){
  const main=document.querySelector('main'),header=document.querySelector('header'),nav=document.querySelector('.bottomnav');
  if(!main)return;
  const vv=window.visualViewport;
  const keyboardOpen=!!(vv&&window.innerHeight-vv.height>140);
  const vh=keyboardOpen?vv.height:Math.max(window.innerHeight,document.documentElement.clientHeight);
  const headerH=(header&&!document.body.classList.contains('header-collapsed'))?header.getBoundingClientRect().height:0;
  const navH=(!keyboardOpen&&nav&&!document.body.classList.contains('reading-active'))?nav.getBoundingClientRect().height:0;
  const available=Math.max(160,vh-headerH-navH);
  main.style.setProperty('--main-available-height',available+'px');
  document.body.classList.toggle('keyboard-open',keyboardOpen);
}
function keepFocusedFieldVisible(target){
  if(!target||!target.matches('input,textarea,select'))return;
  sizeMainArea();
  const main=document.querySelector('main');
  if(!main)return;
  const rect=target.getBoundingClientRect();
  const vv=window.visualViewport;
  const visibleBottom=vv?vv.height:window.innerHeight;
  if(rect.bottom>visibleBottom-24){
    main.scrollTop+=rect.bottom-(visibleBottom-36);
  }else if(rect.top<0){
    main.scrollTop+=rect.top-12;
  }
}

function insertAuthorNoteImage(input){
 const file=input.files&&input.files[0];if(!file)return;
 if(file.size>8*1024*1024){alert('图片请尽量选择 8MB 以内的文件。');input.value='';return}
 const reader=new FileReader();reader.onload=()=>{
  const img=new Image();img.onload=()=>{
   const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/jpeg',.82);
   if(!Array.isArray(window.pendingAuthorNoteImages))window.pendingAuthorNoteImages=[];
   const imageIndex=window.pendingAuthorNoteImages.length;window.pendingAuthorNoteImages.push(data);
   const token='\n[[NOTE_IMAGE:'+imageIndex+']]\n';
   const area=document.getElementById('chapterNoteInput');if(!area)return;
   const start=area.selectionStart??area.value.length,end=area.selectionEnd??start;
   area.value=area.value.slice(0,start)+token+area.value.slice(end);const pos=start+token.length;area.focus();area.setSelectionRange(pos,pos);input.value='';
  };img.onerror=()=>alert('无法读取这张图片，请换一张试试。');img.src=reader.result;
 };reader.readAsDataURL(file);
}
function renderAuthorNote(note, images=[]){
 return String(note).split(/(\[\[NOTE_IMAGE:\d+\]\])/g).map(part=>{
  const m=part.match(/^\[\[NOTE_IMAGE:(\d+)\]\]$/);
  if(m){const src=images[Number(m[1])];return src?`<img class="authornote-image" src="${src}" alt="作者插入的图片" onclick="openImageLightbox(this.src)">`:'';}
  return esc(part).replace(/\n/g,'<br>');
 }).join('');
}

function deleteChapter(bookId,chapterId){

function saveChapterForm(bookId,chapterId){

 if(!title){alert('请先填写章节标题');return}

const READING_PROGRESS_KEY='private_tomato_reading_progress';

  const b=bookBy(currentBook);if(!b)return;

  const all=loadReadingProgress();
  all[currentBook]={chapterId:currentChapter,chapterIndex:idx,scrollTop:Math.max(0,main.scrollTop||0),updatedAt:Date.now()};

function applyLineEndPunctuation(){
  const root=document.querySelector('#readerView .chaptertext');
  if(!root)return;
  root.querySelectorAll('br.line-end-break').forEach(br=>br.remove());
  root.querySelectorAll('.line-end-pair').forEach(w=>{
    const parent=w.parentNode;
    while(w.firstChild)parent.insertBefore(w.firstChild,w);
    parent.removeChild(w);
  });
  root.normalize();

  const punctuation=/[。！？；，、：）》」』】〕〉…％.!?;,：:\)\]}]/;
  const rootStyle=getComputedStyle(root);
  const isPaged=document.body.classList.contains('cover-reader');
  const colWidth=parseFloat(rootStyle.columnWidth);
  const colGap=parseFloat(rootStyle.columnGap)||0;
  const rootRect=root.getBoundingClientRect();
  const padLeft=parseFloat(rootStyle.paddingLeft)||0;

  root.querySelectorAll('.para-text').forEach(host=>{
    const walker=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,{
      acceptNode(node){
        if(!node.nodeValue || !node.nodeValue.trim())return NodeFilter.FILTER_REJECT;
        if(node.parentElement?.closest('button,.para-comments,.line-end-pair'))return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[];
    while(walker.nextNode())nodes.push(walker.currentNode);
    if(!nodes.length)return;

    let finalNode=null, finalIndex=-1;
    for(let n=nodes.length-1;n>=0;n--){
      const value=nodes[n].nodeValue;
      for(let i=value.length-1;i>=0;i--){
        if(!/\s/.test(value[i])){finalNode=nodes[n];finalIndex=i;break;}
      }
      if(finalNode)break;
    }
    if(!finalNode || finalIndex<1)return;
    const text=finalNode.nodeValue;
    const i=finalIndex;
    if(!punctuation.test(text[i]) || /\s/.test(text[i-1]))return;

    const prev=document.createRange(), mark=document.createRange();
    prev.setStart(finalNode,i-1);prev.setEnd(finalNode,i);
    mark.setStart(finalNode,i);mark.setEnd(finalNode,i+1);
    const a=prev.getBoundingClientRect(), b=mark.getBoundingClientRect();
    if(!a.width||!b.width||Math.abs(a.top-b.top)>1.5)return;

    let right=host.getBoundingClientRect().right;

    if(isPaged && Number.isFinite(colWidth) && colWidth>0){
      const period=colWidth+colGap;
      const local=b.left-(rootRect.left+padLeft);
      const col=Math.floor(local/period);
      right=rootRect.left+padLeft+col*period+colWidth;
    }
    const gap=right-b.right;
    const fontSize=parseFloat(getComputedStyle(host).fontSize)||18;

    if(gap < -fontSize*1.2 || gap > fontSize*1.5)return;

    const range=document.createRange();
    range.setStart(finalNode,i-1);range.setEnd(finalNode,i+1);
    const pair=document.createElement('span');
    pair.className='line-end-pair';
    pair.style.whiteSpace='nowrap';
    try{
      pair.appendChild(range.extractContents());
      range.insertNode(pair);
      const br=document.createElement('br');
      br.className='line-end-break';
      pair.parentNode.insertBefore(br,pair);
    }catch(e){}
  });
}
let lineEndPunctuationFrame=0;
function scheduleLineEndPunctuation(){
  cancelAnimationFrame(lineEndPunctuationFrame);
  lineEndPunctuationFrame=requestAnimationFrame(()=>requestAnimationFrame(applyLineEndPunctuation));
}

<div class="card"><h2 style="margin-top:0">本地数据</h2><p class="muted">当前保存 ${db.books.length} 本小说。内容保存在此浏览器的本地存储中，不会自动同步到云端。</p><div class="toolbar"><button onclick="exportDB()">导出备份 JSON</button><button class="secondary" onclick="document.getElementById('importFile').click()">导入备份</button></div><p class="muted">建议定期导出备份到「文件」App。导入备份会用备份内容替换当前书架，请先导出当前版本。</p></div><div class="card"><h2 style="margin-top:0">使用提示</h2><p class="muted">1. 建议在 Safari 中使用。<br>2. 通过 Safari 的分享菜单添加到主屏幕。<br>3. 清除 Safari 网站数据可能删除书库。<br>4. 本版是原型，不会自动上传或公开内容。</p></div><div class="card"><h2 style="margin-top:0">危险操作</h2><button class="secondary" onclick="if(confirm('确定清空所有书籍吗？请先备份。')){db={books:[]};save();showSettings()}">清空书架</button></div>`;const cssField=document.getElementById('globalThemeCSS');if(cssField)cssField.value=localStorage.getItem(GLOBAL_THEME_CSS_KEY)||DEFAULT_GLOBAL_THEME_CSS;show('settingsView')}

function sanitizeExportName(name,fallback='未命名'){return String(name||fallback).replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/[. ]+$/g,'').trim()||fallback}
function exportTextForNote(note,images,bookName,chapterNo){
 const used=[];let imageCounter=0;
 const text=String(note||'').split(/(\[\[NOTE_IMAGE:\d+\]\])/g).map(part=>{
  const m=part.match(/^\[\[NOTE_IMAGE:(\d+)\]\]$/);
  if(!m)return part;
  const idx=Number(m[1]),src=images&&images[idx];
  if(!src)return '';
  const ext=(src.match(/^data:image\/([a-zA-Z0-9.+-]+);/)||[])[1]||'jpeg';
  const safeExt=ext.toLowerCase().replace(/[^a-z0-9]/g,'')||'jpeg';
  const imageName=`images/${String(++imageCounter).padStart(3,'0')}.${safeExt==='jpg'?'jpeg':safeExt}`;
  used.push({path:imageName,dataUrl:src});
  return `\n【图片：${imageName}】\n`;
 }).join('');
 return {text,images:used};
}
function buildVolumeTxt(book,volumeName,includeComments){
 let out=[];
 out.push(volumeName||'未分卷','');
 const imageFiles=[];
 const chapters=(book.chapters||[]).filter(c=>(String(c.volume||'').trim()||'未分卷')===volumeName);
 chapters.forEach((c,index)=>{
  const no=c.chapterNumber??(index+1);
  out.push(`第${no}章　${c.title||'未命名章节'}`,'');
  (c.paragraphs||[]).forEach((p,paragraphIndex)=>{
   const text=String(p.text||'').trim();
   if(!text)return;
   out.push(text,'');
   if(includeComments&&(p.comments||[]).length){
    out.push(`【第${paragraphIndex+1}段段评】`,'');
    (p.comments||[]).forEach((cm,j)=>{out.push(`#${j+1}`,String(cm.text||'').trim(),'');(cm.replies||[]).forEach((rp,k)=>{out.push(`##${k+1}`,String(rp.text||'').trim(),'');});});
   }
  });
  if(String(c.note||'').trim()||((c.noteImages||[]).length)){
   out.push('【作者有话说】','');
   const note=exportTextForNote(c.note||'',c.noteImages||[],book.title,no);
   out.push(note.text.trimEnd(),'');
   note.images.forEach(img=>imageFiles.push(img));
  }
  if(includeComments&&(c.comments||[]).length){
   out.push('【章评】','');
   (c.comments||[]).forEach((cm,j)=>{out.push(`#${j+1}`,String(cm.text||'').trim(),'');(cm.replies||[]).forEach((rp,k)=>{out.push(`##${k+1}`,String(rp.text||'').trim(),'');});});
  }
  out.push('');
 });
 return {text:out.join('\n').replace(/\n{4,}/g,'\n\n\n').trimEnd()+'\n',images:imageFiles};
}
function getBookVolumes(book){
 const seen=new Set(),volumes=[];
 (book.chapters||[]).forEach(c=>{const name=String(c.volume||'').trim()||'未分卷';if(!seen.has(name)){seen.add(name);volumes.push(name)}});
 return volumes;
}
function dataUrlToBytes(dataUrl){const m=String(dataUrl||'').match(/^data:([^;]+);base64,(.*)$/s);if(!m)return null;const bin=atob(m[2]);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return {mime:m[1],bytes}}
function crc32(bytes){let c=0xffffffff;for(let i=0;i<bytes.length;i++){c^=bytes[i];for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function u16(v){return new Uint8Array([v&255,(v>>>8)&255])}
function u32(v){return new Uint8Array([v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255])}
function concatBytes(parts){let n=0;parts.forEach(p=>n+=p.length);const out=new Uint8Array(n);let o=0;parts.forEach(p=>{out.set(p,o);o+=p.length});return out}
function zipStore(files){
 const encoder=new TextEncoder(),local=[],central=[];let offset=0;
 files.forEach(file=>{
  const name=encoder.encode(file.name),data=file.data instanceof Uint8Array?file.data:encoder.encode(file.data);const crc=crc32(data);
  const localHeader=concatBytes([u32(0x04034b50),u16(20),u16(0x800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name]);
  local.push(localHeader,data);const centralHeader=concatBytes([u32(0x02014b50),u16(20),u16(20),u16(0x800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);
  central.push(centralHeader);offset+=localHeader.length+data.length;
 });
 const centralBytes=concatBytes(central),localBytes=concatBytes(local),end=concatBytes([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralBytes.length),u32(localBytes.length),u16(0)]);
 return new Blob([localBytes,centralBytes,end],{type:'application/zip'});
}
function openBookExportPicker(){
 if(!db.books.length){alert('当前书架没有小说可导出。');return}
 const old=document.getElementById('bookExportModal');if(old)old.remove();
 const modal=document.createElement('div');modal.id='bookExportModal';modal.className='export-modal';
 modal.innerHTML=`<div class="export-modal-card"><div class="export-modal-head"><h2>选择要导出的卷</h2><button type="button" class="secondary" onclick="closeBookExportPicker()">×</button></div><label class="export-select-all"><input id="exportSelectAll" type="checkbox" onchange="toggleAllVolumeExports(this.checked)"> 全选所有卷</label><div class="export-book-list">${db.books.map(b=>{const vols=getBookVolumes(b);return `<div class="export-book-item export-book-group"><label><input class="export-book-check-all" type="checkbox" onchange="toggleBookVolumeExports('${esc(b.id)}',this.checked)"><span class="export-book-meta"><span class="export-book-title">${esc(b.title||'未命名小说')}</span><span class="export-book-sub">${vols.length} 卷</span></span></label><div class="export-volume-list">${vols.map(v=>`<label class="export-volume-item"><input class="export-volume-check" data-book-id="${esc(b.id)}" data-volume="${esc(v)}" type="checkbox"><span>${esc(v)}</span></label>`).join('')}</div></div>`}).join('')}</div><p class="muted">每一卷会分别生成一个纯净 TXT 和一个含评论 TXT。作者有话说中的图片会与对应卷一起保存。</p><div class="export-modal-actions"><button type="button" class="secondary" onclick="closeBookExportPicker()">取消</button><button type="button" onclick="exportSelectedVolumesZip()">导出选中的卷</button></div></div>`;
 modal.addEventListener('click',e=>{if(e.target===modal)closeBookExportPicker()});document.body.appendChild(modal);
}
function toggleAllVolumeExports(checked){document.querySelectorAll('#bookExportModal .export-volume-check').forEach(x=>x.checked=checked);document.querySelectorAll('#bookExportModal .export-book-check-all').forEach(x=>x.checked=checked)}
function toggleBookVolumeExports(bookId,checked){document.querySelectorAll(`#bookExportModal .export-volume-check[data-book-id="${CSS.escape(bookId)}"]`).forEach(x=>x.checked=checked);updateExportSelectAllState()}
function updateExportSelectAllState(){const all=[...document.querySelectorAll('#bookExportModal .export-volume-check')],checked=all.filter(x=>x.checked);const allBox=document.getElementById('exportSelectAll');if(allBox)allBox.checked=all.length>0&&checked.length===all.length;document.querySelectorAll('#bookExportModal .export-book-check-all').forEach(box=>{const bookId=box.closest('.export-book-group')?.querySelector('.export-volume-check')?.dataset.bookId;if(!bookId)return;const vols=[...document.querySelectorAll(`#bookExportModal .export-volume-check[data-book-id="${CSS.escape(bookId)}"]`)];box.checked=vols.length>0&&vols.every(x=>x.checked)})}
function closeBookExportPicker(){document.getElementById('bookExportModal')?.remove()}
function exportSelectedVolumesZip(){
 const selected=[...document.querySelectorAll('#bookExportModal .export-volume-check:checked')].map(x=>({bookId:x.dataset.bookId,volume:x.dataset.volume}));
 if(!selected.length){alert('请至少选择一卷。');return}
 const files=[],usedBookNames=new Map();
 const grouped=new Map();
 selected.forEach(item=>{if(!grouped.has(item.bookId))grouped.set(item.bookId,[]);grouped.get(item.bookId).push(item.volume)});
 grouped.forEach((volumes,bookId)=>{
  const book=bookBy(bookId);if(!book)return;
  const base=sanitizeExportName(book.title||'未命名小说');let folder=base,seq=2;while(usedBookNames.has(folder.toLowerCase()))folder=`${base}_${seq++}`;usedBookNames.set(folder.toLowerCase(),true);
  const usedVolumeNames=new Set();
  volumes.forEach(volumeName=>{
   const vb=sanitizeExportName(volumeName||'未分卷');let vf=vb,vseq=2;while(usedVolumeNames.has(vf.toLowerCase()))vf=`${vb}_${vseq++}`;usedVolumeNames.add(vf.toLowerCase());
   const clean=buildVolumeTxt(book,volumeName,false),comments=buildVolumeTxt(book,volumeName,true);
   const enc=new TextEncoder();
   files.push({name:`${folder}/${vf}/${vf}.txt`,data:new Uint8Array([0xef,0xbb,0xbf,...enc.encode(clean.text)])});
   files.push({name:`${folder}/${vf}/${vf}_含评论.txt`,data:new Uint8Array([0xef,0xbb,0xbf,...enc.encode(comments.text)])});
   const images=clean.images.concat(comments.images.filter((img,i)=>!clean.images.some(x=>x.path===img.path)));
   images.forEach(img=>{const decoded=dataUrlToBytes(img.dataUrl);if(decoded)files.push({name:`${folder}/${vf}/${img.path}`,data:decoded.bytes})});
  });
 });
 try{const blob=zipStore(files);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`小说分卷导出_${new Date().toISOString().slice(0,10)}.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);closeBookExportPicker()}catch(e){console.error(e);alert('导出失败：'+(e?.message||e))}
}
function updateReaderBackgroundColor(value){readerPrefs.bgColor=value;localStorage.setItem('private_tomato_reader_bg_color',value);applyReaderPrefs()}
function updateReaderBackgroundImage(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>8*1024*1024){alert('图片请尽量选择 8MB 以内的文件。');input.value='';return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=1400,sc=Math.min(1,m/Math.max(im.width,im.height));c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);readerPrefs.bgImage=c.toDataURL('image/jpeg',.78);localStorage.setItem('private_tomato_reader_bg_image',readerPrefs.bgImage);applyReaderPrefs()};im.src=r.result};r.readAsDataURL(file)}
function clearReaderBackgroundImage(){readerPrefs.bgImage='';localStorage.removeItem('private_tomato_reader_bg_image');applyReaderPrefs();const i=document.getElementById('readerBgImage');if(i)i.value=''}
function updateReaderPrefLive(key,value){if(key==='size'){readerPrefs.size=Number(value);localStorage.setItem('private_tomato_font_size',String(value));document.getElementById('fontSizeValue').textContent=value+'px'}else{readerPrefs.line=Number(value);localStorage.setItem('private_tomato_line_height',String(value));document.getElementById('lineHeightValue').textContent=Number(value).toFixed(2)}applyReaderPrefs();if(currentBook&&currentChapter&&!document.getElementById('readerView').classList.contains('hide')){const el=document.querySelector('#readerView .chaptertext');if(el&&readerPrefs.pageMode==='cover')el.scrollLeft=0}}

function exportDB(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='自定义标题备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importDB(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.books))throw 0;if(!confirm('导入将替换当前书架，确定继续吗？'))return;db=d;save();show('homeView');alert('导入成功')}catch(e){alert('文件格式不正确，无法导入')}};r.readAsText(file)}
document.getElementById('newBookBtn').onclick=()=>editBook(null);document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importDB(e.target.files[0]);e.target.value=''};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));renderHome()});
sizeMainArea();
document.querySelectorAll('.bottomnav button').forEach(b=>b.onclick=()=>{if(b.dataset.view==='settingsView'){showSettings();return}if(b.dataset.action==='directory'){if(currentBook)openDetail(currentBook);else alert('先从书架选择一本小说，进入后这里就会打开它的目录。')}else if(b.dataset.view==='editorView')editBook(null);else if(b.dataset.view==='settingsView')showSettings();else show('homeView')});
applyMode();

document.getElementById('showHeaderBtn').onclick=showHeader;document.getElementById('nightModeBtn').onclick=toggleNightMode;
const readerTintTrigger=document.getElementById('readerTintTrigger');
const readerTintMenu=document.getElementById('readerTintMenu');
if(readerTintTrigger&&readerTintMenu){readerTintTrigger.onclick=e=>{e.stopPropagation();readerTintMenu.classList.toggle('open')};readerTintMenu.querySelectorAll('[data-reader-tint]').forEach(btn=>btn.onclick=()=>setReaderBackdropTint(btn.dataset.readerTint));document.addEventListener('click',e=>{if(!e.target.closest('#readerTintPicker'))readerTintMenu.classList.remove('open')});}
updateReaderTintPickerVisibility();applyReaderBackdrop();
